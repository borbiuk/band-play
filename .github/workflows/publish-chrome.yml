name: publish-chrome

# Manually triggered publishing to the Chrome Web Store.
# Run it from the Actions tab: select the branch and press "Run workflow".
on:
    workflow_dispatch:

permissions:
    contents: read

# Prevent two publish runs from racing each other
concurrency:
    group: publish-chrome
    cancel-in-progress: false

jobs:
    publish:
        # Store releases come from master only
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Configure required reviewers for this environment in the repository settings
        environment: store
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - name: Check the registry signatures of the installed packages
              run: npm audit signatures
            - name: Versions, lint, type check and unit tests
              run: |
                  npm run check:versions
                  npm run lint
                  npm run test:unit
            - name: Check that Chrome and Firefox manifest versions match
              run: |
                  chrome_version=$(jq -r '.version' public/manifest.json)
                  firefox_version=$(jq -r '.version' public/manifest.firefox.json)
                  if [ "$chrome_version" != "$firefox_version" ]; then
                    echo "Manifest versions do not match: chrome=$chrome_version, firefox=$firefox_version"
                    exit 1
                  fi
                  echo "Publishing version **$chrome_version** to the Chrome Web Store" >> "$GITHUB_STEP_SUMMARY"
            # zip.sh packages both browsers; only the Chrome package is used here
            - name: Build and package (zip.sh)
              run: npm run zip
            - name: Rename the package
              run: mv artifacts/band-play-build-chrome_*.zip chrome.zip
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: chrome-package
                  path: chrome.zip
                  if-no-files-found: error
            - name: Upload and publish to Chrome Web Store
              run: npx --no chrome-webstore-upload --source chrome.zip --extension-id "$EXTENSION_ID"
              env:
                  EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  # Chrome Web Store API v2 (v1.1 stopped on 15 October 2026) needs the publisher ID
                  PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
