name: publish-chrome

# Manually triggered publishing to the Chrome Web Store.
# Run it from the Actions tab: select the branch and press "Run workflow".
on:
    workflow_dispatch:

permissions:
    contents: read

# Prevent two publish runs from racing each other
concurrency:
    group: publish-chrome
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - name: Check that Chrome and Firefox manifest versions match
              run: |
                  chrome_version=$(jq -r '.version' public/manifest.json)
                  firefox_version=$(jq -r '.version' public/manifest.firefox.json)
                  if [ "$chrome_version" != "$firefox_version" ]; then
                    echo "Manifest versions do not match: chrome=$chrome_version, firefox=$firefox_version"
                    exit 1
                  fi
                  echo "Publishing version **$chrome_version** to the Chrome Web Store" >> "$GITHUB_STEP_SUMMARY"
            # zip.sh packages both browsers; only the Chrome package is used here
            - name: Build and package (zip.sh)
              run: npm run zip
            - name: Rename the package
              run: mv band-play-build-chrome_*.zip chrome.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: chrome-package
                  path: chrome.zip
                  if-no-files-found: error
            - name: Upload and publish to Chrome Web Store
              run: npx --yes chrome-webstore-upload-cli@3 --source chrome.zip --extension-id "$EXTENSION_ID"
              env:
                  EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
