name: publish-chrome

# Manually triggered upload of a release to the Chrome Web Store.
# The zip is the file of the GitHub Release that the release workflow built and attested, so the
# store gets the same bytes. Run it from the Actions tab (select master and enter the version) or with
# `gh workflow run publish-chrome.yml --ref master -f version=x.y.z`.
on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version of the GitHub Release to publish, x.y.z'
                required: true
                type: string

permissions:
    contents: read

# Prevent two publish runs from racing each other
concurrency:
    group: publish-chrome
    cancel-in-progress: false

jobs:
    publish:
        # Store releases come from master only
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Configure required reviewers for this environment in the repository settings
        environment: store
        env:
            GH_TOKEN: ${{ github.token }}
            # The version reaches the scripts through the environment, never through the script text
            VERSION: ${{ inputs.version }}
        steps:
            - name: Check the version input
              run: |
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "The version '$VERSION' is not x.y.z"
                    exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: npm
            # chrome-webstore-upload is a development dependency of the repository
            - run: npm ci
            - name: Check the registry signatures of the installed packages
              run: npm audit signatures
            - name: Download the Chrome zip of the release
              run: gh release download "$VERSION" --pattern "band-play-chrome-${VERSION}.zip" --output chrome.zip
            - name: Check the version inside the zip
              run: |
                  zip_version=$(unzip -p chrome.zip manifest.json | jq -r '.version')
                  if [ "$zip_version" != "$VERSION" ]; then
                    echo "The zip has the version $zip_version, expected $VERSION"
                    exit 1
                  fi
                  echo "Publishing version **$VERSION** to the Chrome Web Store" >> "$GITHUB_STEP_SUMMARY"
            - name: Verify the build provenance of the zip
              run: gh attestation verify chrome.zip -R "$GITHUB_REPOSITORY"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: chrome-package
                  path: chrome.zip
                  if-no-files-found: error
            - name: Upload and publish to Chrome Web Store
              # Call the binary directly: npx would read --source and --extension-id as its own options
              run: ./node_modules/.bin/chrome-webstore-upload --source chrome.zip --extension-id "$EXTENSION_ID"
              env:
                  EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  # Chrome Web Store API v2 (v1.1 stopped on 15 October 2026) needs the publisher ID
                  PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
