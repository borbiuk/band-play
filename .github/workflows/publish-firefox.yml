name: publish-firefox

# Manually triggered submission of a release to Firefox Add-ons (AMO).
# The zip is the file of the GitHub Release that the release workflow built and attested. The source
# archive is the tagged commit, which is the commit the zip was built from.
# Run it from the Actions tab (select master and enter the version) or with
# `gh workflow run publish-firefox.yml --ref master -f version=x.y.z`.
on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version of the GitHub Release to submit, x.y.z'
                required: true
                type: string

permissions:
    contents: read

# Prevent two publish runs from racing each other
concurrency:
    group: publish-firefox
    cancel-in-progress: false

jobs:
    publish:
        # Store releases come from master only
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Configure required reviewers for this environment in the repository settings
        environment: store
        env:
            GH_TOKEN: ${{ github.token }}
            # The version reaches the scripts through the environment, never through the script text
            VERSION: ${{ inputs.version }}
        steps:
            - name: Check the version input
              run: |
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "The version '$VERSION' is not x.y.z"
                    exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: npm
            # web-ext is a development dependency of the repository
            - run: npm ci
            - name: Check the registry signatures of the installed packages
              run: npm audit signatures
            - name: Download the Firefox zip of the release
              run: gh release download "$VERSION" --pattern "band-play-firefox-${VERSION}.zip" --output firefox.zip
            - name: Check the version inside the zip
              run: |
                  zip_version=$(unzip -p firefox.zip manifest.json | jq -r '.version')
                  if [ "$zip_version" != "$VERSION" ]; then
                    echo "The zip has the version $zip_version, expected $VERSION"
                    exit 1
                  fi
                  echo "Publishing version **$VERSION** to Firefox Add-ons (AMO)" >> "$GITHUB_STEP_SUMMARY"
            - name: Verify the build provenance of the zip
              run: gh attestation verify firefox.zip -R "$GITHUB_REPOSITORY"
            - name: Archive the source of the tagged commit for the AMO review
              run: |
                  git fetch --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
                  git archive -o source.zip "refs/tags/${VERSION}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: firefox-package
                  path: |
                      firefox.zip
                      source.zip
                  if-no-files-found: error
            # web-ext sign expects an unpacked extension directory, so unpack the zip of the release
            - name: Unpack the package for web-ext
              run: unzip -q firefox.zip -d firefox-package
            # --approval-timeout 0: exit right after the submission instead of
            # waiting for the AMO review, which takes longer than a CI job
            - name: Submit to Firefox Add-ons (AMO)
              run: |
                  npx --no web-ext sign \
                    --source-dir firefox-package \
                    --channel listed \
                    --upload-source-code source.zip \
                    --approval-timeout 0
              env:
                  WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
